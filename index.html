</head>

  <body>
    <div id="app-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0fdf4;z-index:99999;transition:opacity .4s ease">
      <!-- Brand icon -->
      <img src="/images/fast-calories-logo.png" alt="Fast Calories" style="width:80px;height:auto;margin-bottom:24px" />
      <div style="font-family:system-ui,-apple-system,sans-serif;font-size:20px;font-weight:700;color:#15803d;margin-bottom:8px">Fast Calories</div>
      <div style="font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#4ade80;margin-bottom:24px">Eat Smart, Live Healthy</div>
      <!-- Progress bar -->
      <div style="width:200px;height:4px;background:#dcfce7;border-radius:4px;overflow:hidden">
        <div id="app-loader-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:4px;transition:width .3s ease"></div>
      </div>
    </div>
    <script>
      // Animate progress bar while app loads
      (function(){
        var bar=document.getElementById('app-loader-bar');
        var w=0;
        var iv=setInterval(function(){
          w+=Math.random()*15;
          if(w>90)w=90;
          if(bar)bar.style.width=w+'%';
        },300);
        var done=false;
        window.__dismissLoader=function(){
          done=true;
          clearInterval(iv);
          if(bar)bar.style.width='100%';
          setTimeout(function(){
            var el=document.getElementById('app-loader');
            if(el){el.style.opacity='0';setTimeout(function(){el.remove()},400)}
          },200);
        };

        // Watchdog: if the app never mounts (usually a stale service-worker
        // cache serving an old index.html with dead asset URLs), purge the
        // cache and reload once instead of hanging on the loader forever.
        function recover(){
          if(done)return;
          try{
            if(sessionStorage.getItem('fc_boot_recovered')==='1'){
              var el=document.getElementById('app-loader');
              if(el)el.innerHTML='<div style="font-family:system-ui,sans-serif;text-align:center;color:#15803d;padding:24px"><div style="font-weight:700;margin-bottom:8px">Couldn\'t load Fast Calories</div><div style="font-size:13px;color:#4b5563;margin-bottom:16px">Please check your connection and try again.</div><button onclick="location.reload()" style="background:#16a34a;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:14px">Retry</button></div>';
              return;
            }
            sessionStorage.setItem('fc_boot_recovered','1');
          }catch(e){}
          var tasks=[];
          if('caches' in window){
            tasks.push(caches.keys().then(function(keys){
              return Promise.all(keys.map(function(k){return caches.delete(k)}));
            }).catch(function(){}));
          }
          if('serviceWorker' in navigator){
            tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
              return Promise.all(regs.map(function(r){return r.unregister()}));
            }).catch(function(){}));
          }
          Promise.all(tasks).then(function(){
            location.replace(location.pathname + location.search + (location.search?'&':'?') + 'fcreload=' + Date.now() + location.hash);
          });
        }
        setTimeout(recover, 12000);
        window.addEventListener('error', function(e){
          var t=e.target;
          if(t&&(t.tagName==='SCRIPT'||t.tagName==='LINK')) recover();
        }, true);
        window.addEventListener('load', function(){
          try{ if(done) sessionStorage.removeItem('fc_boot_recovered'); }catch(e){}
        });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
